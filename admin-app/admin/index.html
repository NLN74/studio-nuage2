<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/site/favicon.svg" type="image/svg+xml"><link rel="icon" href="/site/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/site/apple-touch-icon.png" sizes="180x180"><title>Nuage — Administration</title><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/site/leaflet-1.9.4.css"><script nonce="__NONCE__" src="/site/leaflet-1.9.4.js" defer></script><script nonce="__NONCE__" src="/admin/runtime.js" defer></script><script nonce="__NONCE__" src="/admin/admin.js" type="module"></script></head><body>
<div class="app">
<aside class="rail"><a class="atelier-logo" href="/admin/">nuage<span>ADMINISTRATION</span></a><nav class="main-nav" aria-label="Outils de l’éditeur"><button data-view="editor" class="active"><span>▧</span> Modifier le site</button><button data-view="media"><span>▦</span> Photos</button><button data-view="theme"><span>◐</span> Couleurs et écritures</button><button data-view="settings"><span>⚙</span> Infos du studio</button><button data-view="history"><span>↶</span> Versions sauvegardées</button></nav><div class="rail-bottom"><button id="logout" class="rail-help">Déconnexion</button><button id="help-button" class="rail-help" title="Aide">? <span>Aide</span></button><details class="advanced-tools"><summary>Options</summary><button id="export-site" class="subtle">Exporter le site</button><button id="export-data" class="subtle">Exporter une sauvegarde</button><label class="import-label">Importer une sauvegarde<input id="import-data" type="file" accept="application/json,.json" hidden></label><button id="keep-draft" class="subtle">Garder un brouillon</button></details></div></aside>
<div class="workspace"><header class="topbar"><div class="top-heading"><label class="page-picker">Page à modifier<select id="page-select" aria-label="Page à modifier"></select></label><strong id="current-page" hidden>Accueil</strong><span id="dirty" class="status">Enregistré</span></div><div class="top-actions"><a id="open-site" class="button-secondary view-site" href="/site/" target="_blank" rel="noopener noreferrer">Voir le site<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><path d="M5 15 15 5M5 5h10v10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a><button id="undo" class="icon" title="Annuler" aria-label="Annuler">↶</button><button id="redo" class="icon" title="Rétablir" aria-label="Rétablir">↷</button><button id="save" class="button-secondary advanced-only">Garder un brouillon</button><button id="apply" class="button-primary">Enregistrer <span>✓</span></button></div></header>
<section id="editor-view" class="view editor-view simple-layout"><aside class="page-panel"><div class="panel-title"><h2>Pages</h2><button id="add-page" class="plus" aria-label="Ajouter une page">+</button></div><div id="pages" class="pages"></div><div class="structure-heading"><h2>Structure</h2><button id="add-section" class="plus" aria-label="Ajouter une section">+</button></div><div id="outline" class="outline"></div><div class="page-tools"><button id="page-settings">Réglages de la page ↗</button><button id="duplicate-page">Dupliquer cette page</button></div></aside>
<div class="canvas-area"><div class="canvas-toolbar"><div class="segmented"><button data-device="desktop" class="active" aria-label="Vue ordinateur">▱ <span>Grand écran</span></button><button data-device="mobile" aria-label="Vue téléphone">▯ <span>Mobile</span></button></div><label class="edit-mode"><input id="edit-mode" type="checkbox" checked> Cliquer pour modifier</label><button id="expand-preview" title="Agrandir l’aperçu">Agrandir ↗</button></div><div class="canvas-caption"><span id="preview-page-name">Accueil</span><span id="preview-dimensions">Vue téléphone</span></div><div id="stage" class="stage"><div class="iframe-box"><iframe id="preview" title="Aperçu modifiable du site" src="about:blank"></iframe></div></div><div class="canvas-foot"><button id="organize-page">Organiser la page</button><button id="add-bottom">+ Ajouter un bloc</button></div></div>
<aside id="inspector" class="inspector"><div class="inspector-empty"><h2>Sélectionnez un élément</h2><p>Cliquez dans l’aperçu.</p></div></aside></section>
<section id="media-view" class="view full-view" hidden></section><section id="theme-view" class="view full-view" hidden></section><section id="settings-view" class="view full-view" hidden></section><section id="history-view" class="view full-view" hidden></section>
</div></div><div id="toast" class="toast" role="status"></div><dialog id="modal"><form method="dialog"><button class="modal-close" aria-label="Fermer">×</button></form><div id="modal-body"></div></dialog><input id="image-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple hidden>
</body></html>
